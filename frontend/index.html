<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMatch Perú - Recetas con lo que tienes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981',
                        secondary: '#f59e0b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <svg class="h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span class="ml-2 text-xl font-bold text-gray-900">MealMatch Perú</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="bg-gradient-to-br from-emerald-50 to-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl font-extrabold text-gray-900 sm:text-5xl md:text-6xl">
                ¿Qué cocinar con lo que tienes?
            </h1>
            <p class="mt-3 max-w-md mx-auto text-base text-gray-500 sm:text-lg md:mt-5 md:text-xl md:max-w-3xl">
                Ingresa los ingredientes que tienes en tu refrigeradora y descubre recetas peruanas deliciosas y económicas.
            </p>
        </div>
    </div>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="mb-4">
                <label for="ingredients" class="block text-sm font-medium text-gray-700 mb-2">
                    Ingredientes (separados por coma)
                </label>
                <input 
                    type="text" 
                    id="ingredients" 
                    placeholder="Ej: pollo, papa, aji amarillo, cebolla..."
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition"
                    autocomplete="off"
                >
            </div>
            <button 
                onclick="searchRecipes()"
                class="w-full bg-primary hover:bg-emerald-600 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 transform hover:scale-[1.02]"
            >
                Buscar Recetas
            </button>
        </div>

        <div id="results" class="space-y-4"></div>

        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-300 border-t-primary"></div>
            <p class="mt-4 text-gray-500">Buscando las mejores recetas...</p>
        </div>

        <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg"></div>

    </main>

    <div id="recipeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-2xl font-bold text-gray-900" id="modalTitle"></h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div id="modalContent" class="text-gray-600"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        async function searchRecipes() {
            const input = document.getElementById('ingredients');
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');

            const ingredientsText = input.value.trim();
            if (!ingredientsText) {
                showError('Por favor ingresa al menos un ingrediente.');
                return;
            }

            const ingredients = ingredientsText.split(',').map(i => i.trim()).filter(i => i);

            resultsDiv.innerHTML = '';
            errorDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');

            try {
                const response = await fetch(`${API_URL}/recipes/match`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ingredients, limit: 10 }),
                });
                const data = await response.json();

                loadingDiv.classList.add('hidden');

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="text-center py-12">
                            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 1-1-18 0 9 9 0 0 1 18 0z"/>
                            </svg>
                            <h3 class="mt-2 text-sm font-medium text-gray-900">No se encontraron recetas</h3>
                            <p class="mt-1 text-sm text-gray-500">Intenta con otros ingredientes.</p>
                        </div>
                    `;
                    return;
                }

                data.results.forEach(recipe => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition cursor-pointer';
                    card.onclick = () => showRecipeDetail(recipe.id);

                    const matchColor = recipe.match_score >= 70 ? 'text-green-600 bg-green-50' : recipe.match_score >= 40 ? 'text-yellow-600 bg-yellow-50' : 'text-gray-600 bg-gray-50';
                    const matchText = recipe.match_score >= 70 ? 'Excelente coincidencia' : recipe.match_score >= 40 ? 'Coincidencia media' : 'Coincidencia baja';

                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <h3 class="text-xl font-bold text-gray-900">${recipe.name}</h3>
                                <p class="text-gray-600 mt-1 line-clamp-2">${recipe.description || ''}</p>
                                <div class="mt-3 flex flex-wrap gap-2">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-800">
                                        ${recipe.region || 'Nacional'}
                                    </span>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
                                        ${recipe.difficulty}
                                    </span>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800">
                                        ${recipe.prep_time_minutes} min
                                    </span>
                                </div>
                            </div>
                            <div class="ml-4 flex-shrink-0">
                                <span class="inline-flex flex-col items-center px-3 py-2 rounded-lg text-sm font-semibold ${matchColor}">
                                    ${recipe.match_score}%
                                    <span class="text-xs font-normal mt-0.5">${matchText}</span>
                                </span>
                            </div>
                        </div>
                        <div class="mt-3 grid grid-cols-2 gap-2 text-sm">
                            <div class="bg-gray-50 p-2 rounded">
                                <span class="text-gray-500">Cobertura:</span>
                                <span class="font-semibold text-gray-900 ml-1">${recipe.coverage}%</span>
                            </div>
                            <div class="bg-gray-50 p-2 rounded">
                                <span class="text-gray-500">Faltantes:</span>
                                <span class="font-semibold text-gray-900 ml-1">${recipe.missing_count}</span>
                            </div>
                        </div>
                        <div class="mt-3">
                            <p class="text-xs text-gray-500">Ingredientes que tienes: </p>
                            <div class="mt-1 flex flex-wrap gap-1">
                                ${recipe.matched_ingredients.map(ing => `<span class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded">${ing}</span>`).join('')}
                            </div>
                            ${recipe.missing_ingredients.length > 0 ? `
                                <p class="text-xs text-red-500 mt-2">Te faltan:</p>
                                <div class="mt-1 flex flex-wrap gap-1">
                                    ${recipe.missing_ingredients.map(ing => `<span class="inline-block bg-red-100 text-red-800 text-xs px-2 py-1 rounded">${ing}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (error) {
                loadingDiv.classList.add('hidden');
                showError('Error al buscar recetas. Asegúrate de que el backend esté corriendo en http://localhost:8000');
                console.error(error);
            }
        }

        async function showRecipeDetail(recipeId) {
            try {
                const response = await fetch(`${API_URL}/recipes/${recipeId}`);
                const recipe = await response.json();
                
                document.getElementById('modalTitle').textContent = recipe.name;
                document.getElementById('modalContent').innerHTML = `
                    <img src="${recipe.image_url}" alt="${recipe.name}" class="w-full h-48 object-cover rounded-lg mb-4" onerror="this.src='https://placehold.co/600x400?text=Receta'">
                    
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">${recipe.region || 'Nacional'}</span>
                        <span class="bg-gray-100 text-gray-800 text-xs px-2 py-1 rounded">${recipe.difficulty}</span>
                        <span class="bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded">${recipe.prep_time_minutes} min</span>
                        <span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded">${recipe.servings} porciones</span>
                    </div>

                    ${recipe.description ? `<p class="text-gray-600 mb-4">${recipe.description}</p>` : ''}

                    <div class="mb-4">
                        <h4 class="font-semibold text-gray-900 mb-2">Ingredientes</h4>
                        <p class="text-sm text-gray-500 mb-1">Tienes <span class="font-semibold text-green-700">${recipe.matched_count}</span> de <span class="font-semibold">${recipe.matched_count + recipe.missing_count}</span></p>
                        <div class="flex flex-wrap gap-1 mb-2">
                            ${recipe.matched_ingredients.map(ing => `<span class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded">${ing}</span>`).join('')}
                        </div>
                        ${recipe.missing_ingredients.length > 0 ? `
                            <p class="text-sm text-red-500 mb-1">Te faltan <span class="font-semibold">${recipe.missing_count}</span>:</p>
                            <div class="flex flex-wrap gap-1">
                                ${recipe.missing_ingredients.map(ing => `<span class="inline-block bg-red-100 text-red-800 text-xs px-2 py-1 rounded">${ing}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>

                    <div class="mb-4">
                        <h4 class="font-semibold text-gray-900 mb-2">Preparación</h4>
                        <ol class="list-decimal list-inside text-gray-600 space-y-2">
                            ${recipe.steps.map(step => `<li>${step}</li>`).join('')}
                        </ol>
                    </div>

                    ${recipe.nutritional_info && Object.keys(recipe.nutritional_info).length > 0 ? `
                        <div class="border-t pt-4 mt-4">
                            <h4 class="font-semibold text-gray-900 mb-2">Información Nutricional (aprox.)</h4>
                            <div class="grid grid-cols-2 gap-2 text-sm">
                                ${Object.entries(recipe.nutritional_info).map(([key, value]) => `
                                    <div class="bg-gray-50 p-2 rounded">
                                        <span class="text-gray-500 capitalize">${key}</span>: 
                                        <span class="font-semibold">${value}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                `;
                
                document.getElementById('recipeModal').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading recipe:', error);
                alert('Error al cargar la receta.');
            }
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.add('hidden');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        document.getElementById('ingredients').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchRecipes();
            }
        });

        document.getElementById('recipeModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
